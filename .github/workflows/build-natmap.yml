name: Build natmap

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          repository: heiher/natmap
          ref: master

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential autoconf automake libtool \
            pkg-config git

      - name: Build
        run: |
          ./autogen.sh || true
          ./configure
          make -j$(nproc)

      - name: Package artifact
        run: |
          mkdir -p artifact
          cp natmap artifact/ || true
          tar -czf natmap-build.tgz artifact

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: natmap
          path: natmap-build.tgz
