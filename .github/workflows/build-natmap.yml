name: Build natmap (OpenWrt 18.06 Siflower)

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout forked OpenWrt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 确保完整拉取

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev \
            python3-distutils rsync unzip zlib1g-dev file wget

      - name: Add natmap package
        run: |
          mkdir -p package/natmap
          git clone https://github.com/heiher/natmap.git package/natmap/src
          cat > package/natmap/Makefile <<'EOF'
          include $(TOPDIR)/rules.mk

          PKG_NAME:=natmap
          PKG_VERSION:=git
          PKG_RELEASE:=1

          PKG_SOURCE_PROTO:=git
          PKG_SOURCE_URL:=https://github.com/heiher/natmap.git
          PKG_SOURCE_DATE:=2025-01-01
          PKG_SOURCE_VERSION:=HEAD
          PKG_MIRROR_HASH:=skip

          PKG_BUILD_DIR:=$(BUILD_DIR)/$(PKG_NAME)

          include $(INCLUDE_DIR)/package.mk

          define Package/natmap
            SECTION:=net
            CATEGORY:=Network
            TITLE:=NATMap - NAT traversal port mapping tool
            URL:=https://github.com/heiher/natmap
          endef

          define Package/natmap/description
           NATMap is a tool to establish TCP/UDP port mapping from ISP NAT public address
           to local private address, useful for NAT traversal.
          endef

          define Build/Compile
            $(MAKE) -C $(PKG_BUILD_DIR) \
              CC="$(TARGET_CC)" \
              CFLAGS="$(TARGET_CFLAGS)" \
              LDFLAGS="$(TARGET_LDFLAGS)"
          endef

          define Package/natmap/install
            $(INSTALL_DIR) $(1)/usr/bin
            $(INSTALL_BIN) $(PKG_BUILD_DIR)/natmap $(1)/usr/bin/
          endef

          $(eval $(call BuildPackage,natmap))
          EOF

      - name: Prepare feeds
        run: |
          cd openwrt-18.06
          sed -i 's,https://git.openwrt.org/feed/packages.git,https://github.com/openwrt/packages.git,' feeds.conf.default
          sed -i 's,https://git.openwrt.org/project/luci.git,https://github.com/openwrt/luci.git,' feeds.conf.default
          sed -i 's,https://git.openwrt.org/feed/routing.git,https://github.com/openwrt/routing.git,' feeds.conf.default
          sed -i 's,https://git.openwrt.org/feed/telephony.git,https://github.com/openwrt/telephony.git,' feeds.conf.default
          chmod +x ./scripts/feeds
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Build natmap
        run: |
          make defconfig
          make package/natmap/compile V=s

      - name: Upload natmap ipk
        uses: actions/upload-artifact@v4
        with:
          name: natmap-ipk
          path: bin/packages/*/base/natmap_*.ipk
